[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rmsync"
version = "0.1.0"
requires-python = ">=3.12"
description = "reMarkable-to-cloud sync layer above rmfakecloud"
dependencies = [
    "pyyaml>=6.0",
    "attrs>=23.2",
    "inotify-simple>=1.3.5; sys_platform == 'linux'",
]

[project.entry-points."rmsync.backends"]
null = "rmsync.plugins.null:NullBackend"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rmsync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
